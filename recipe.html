<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe | Taste Finder</title>
<style>
  :root{--bg:#fffdf9;--surface:#fff;--text:#202124;--muted:#73777d;--border:#dddfe3;--accent:#f46f3e;--accent-dark:#db5c2d;--soft:#fff0ea}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Arial,sans-serif}a{color:inherit;text-decoration:none}
  header{border-bottom:1px solid var(--border);background:rgba(255,253,249,.95)}nav{width:min(1040px,calc(100% - 32px));height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:2px;font-size:22px}.home{padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:white;font-weight:700}
  main{width:min(1040px,calc(100% - 32px));margin:34px auto 60px}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px);gap:36px;align-items:start}.photo{width:100%;aspect-ratio:1.2;border-radius:18px;object-fit:cover;background:#eceff1}.fallback{display:grid;place-items:center;font-size:90px}.eyebrow{color:var(--accent-dark);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px}.eyebrow+ h1{margin-top:9px}h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0 0 14px}.description{color:var(--muted);font-size:17px}.facts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.fact{padding:8px 11px;border:1px solid var(--border);border-radius:10px;background:#f6f7f8;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:white;font-weight:800}.primary{background:var(--accent);border-color:var(--accent);color:white}.section-grid{display:grid;grid-template-columns:.8fr 1.3fr;gap:36px;margin-top:44px}.section h2{font-size:22px}.ingredients{display:grid;gap:8px}.ingredient{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #eef0f1}.ingredient strong{color:#51555a}.steps{display:grid;gap:14px}.step{display:grid;grid-template-columns:30px 1fr;gap:11px}.number{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent-dark);display:grid;place-items:center;font-weight:900}.notes{margin-top:32px;padding:15px 16px;border:1px solid #ffdacc;border-radius:13px;background:#fff8f4;color:#5d504a}footer{border-top:1px solid var(--border);padding:24px 16px;color:var(--muted);text-align:center;font-size:13px}
  @media(max-width:760px){.hero,.section-grid{grid-template-columns:1fr}.hero{gap:22px}.photo{aspect-ratio:1.45}}
</style>
</head>
<body>
<header><nav><a class="brand" href="index.html">TASTE FINDER</a><a class="home" href="index.html">Go to home</a></nav></header>
<main id="content"></main>
<footer>Taste Finder · Static recipe page</footer>
<script>
const recipe=JSON.parse(localStorage.getItem("tasteFinderCurrentRecipe")||"null");
const content=document.getElementById("content");
if(!recipe){content.innerHTML='<section><h1>Recipe not found</h1><p>Open a recipe from the home page first.</p><a class="action primary" href="index.html">Browse recipes</a></section>'}
else{
  const image=recipe.image?`<div><img class="photo" src="${recipe.image}" alt="${recipe.title}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="photo fallback" hidden>${recipe.icon}</div></div>`:`<div class="photo fallback">${recipe.icon}</div>`;
  content.innerHTML=`<section class="hero"><div>${image}</div><div><div class="eyebrow">${recipe.tags.join(" · ")}</div><h1>${recipe.title}</h1><p class="description">A ${recipe.difficulty.toLowerCase()} recipe with a practical prep flow and balanced ingredients.</p><div class="facts"><span class="fact">${recipe.time} min</span><span class="fact">${recipe.difficulty}</span><span class="fact">★ ${recipe.rating.toFixed(1)}</span><span class="fact">${recipe.servings} servings</span><span class="fact">${recipe.calories} kcal / serving</span></div><div class="actions"><a class="action primary" href="share.html?id=${recipe.id}">Share recipe</a><a class="action" href="taste-finder.html">Back to recipes</a></div></div></section><section class="section-grid"><div class="section"><h2>Ingredients</h2><div class="ingredients">${recipe.ingredients.map(item=>`<div class="ingredient"><span>${item[0]}</span><strong>${item[1]}</strong></div>`).join("")}</div></div><div class="section"><h2>Step-by-step</h2><div class="steps">${recipe.steps.map((step,index)=>`<div class="step"><span class="number">${index+1}</span><span>${step}</span></div>`).join("")}</div></div></section><div class="notes"><strong>Kitchen note:</strong> ${recipe.notes}</div>`;
}
</script>
</body>
</html>
